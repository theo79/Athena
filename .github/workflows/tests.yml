name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python -m pip check

  linux-distributions:
    name: ${{ matrix.distribution }} / distribution Python
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Debian
            image: debian:stable-slim
            install: apt-get update && apt-get install -y --no-install-recommends python3 python3-venv python3-pip git ca-certificates
          - distribution: Fedora
            image: fedora:latest
            install: dnf install -y python3 python3-pip git ca-certificates
          - distribution: Arch
            image: archlinux:base
            install: pacman -Syu --noconfirm --needed python python-pip git ca-certificates
    steps:
      - name: Install distribution Python
        run: ${{ matrix.install }}
      - uses: actions/checkout@v4
      - name: Create isolated environment
        run: |
          python3 -c "import sys; assert sys.version_info >= (3, 12), 'Python 3.12+ required'"
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install ".[dev]"
      - run: .venv-ci/bin/python -m pytest -q
      - run: .venv-ci/bin/python -m pip check
