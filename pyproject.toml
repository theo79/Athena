[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-ai-assistant"
version = "0.12"
description = "Athena, a local AI work assistant with explicit tool permissions"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
athena = "provider_cli:main"
athena-settings = "web_settings:main"

[project.optional-dependencies]
dev = ["pytest"]
build = ["pyinstaller==6.22.0"]

[tool.setuptools]
py-modules = ["agent", "agent_runtime", "conversation", "diagnostics", "experience", "json_storage", "memory_service", "memory_migration", "memory_retrieval", "device_protocol", "device_gateway", "device_simulator", "models", "provider_configuration", "provider_cli", "web_settings", "runtime_paths", "search_provider", "settings", "sqlite_store", "tools"]
packages = ["tool_modules", "web_assets"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.setuptools.package-data]
web_assets = ["*.html", "*.css", "*.js"]
